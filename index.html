<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crushie · 互動劇情</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #0a0612;
    color: #fff;
  }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    margin: 0 auto;
    background: linear-gradient(180deg, #1a0f1f 0%, #0f0817 50%, #1a0f1f 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ====== 通用 Header ====== */
  .header {
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    padding-bottom: 14px;
    padding-left: 16px;
    padding-right: 16px;
    background: linear-gradient(180deg, rgba(40, 15, 50, 0.95), rgba(20, 8, 30, 0.85));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 80, 130, 0.15);
    z-index: 10;
  }

  .back-btn, .header-action {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 88, 130, 0.15);
    color: #ff5882;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    transition: background 0.2s;
  }

  .back-btn { font-size: 24px; background: transparent; }
  .back-btn:active { background: rgba(255, 88, 130, 0.15); }

  .header-info {
    flex: 1;
    min-width: 0;
  }

  .header-info .name {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .verified {
    width: 14px;
    height: 14px;
    background: #ff5882;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #fff;
  }

  .header-info .status {
    font-size: 12px;
    color: #b8a0c4;
    margin-top: 2px;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 18px;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(255, 88, 130, 0.35);
  }

  .avatar.online::after {
    content: '';
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 10px;
    height: 10px;
    background: #2bd17e;
    border-radius: 50%;
    border: 2px solid #1a0f1f;
  }

  /* ====== 視圖切換 ====== */
  .view {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .view.active {
    display: flex;
  }

  /* ====== 首頁 ====== */
  .home-header {
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 12px;
    background: linear-gradient(180deg, rgba(40, 15, 50, 0.95), rgba(20, 8, 30, 0.85));
    border-bottom: 1px solid rgba(255, 80, 130, 0.15);
  }

  .home-header h1 {
    font-size: 26px;
    background: linear-gradient(135deg, #ff5882, #ffadc4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .home-header p {
    color: #b8a0c4;
    font-size: 13px;
    margin-top: 4px;
  }

  .home-header .home-actions {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 16px;
  }

  .character-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 24px;
    -webkit-overflow-scrolling: touch;
  }

  .character-list::-webkit-scrollbar { width: 0; }

  .section-label {
    color: #6a5478;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 12px 8px 6px;
    text-transform: uppercase;
  }

  .character-card {
    background: linear-gradient(135deg, rgba(60, 30, 75, 0.5), rgba(40, 20, 55, 0.5));
    border: 1px solid rgba(255, 88, 130, 0.18);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.25s;
    animation: cardIn 0.4s ease backwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .character-card:nth-child(2) { animation-delay: 0.05s; }
  .character-card:nth-child(3) { animation-delay: 0.1s; }
  .character-card:nth-child(4) { animation-delay: 0.15s; }

  .character-card:active {
    transform: scale(0.98);
    background: linear-gradient(135deg, rgba(80, 40, 100, 0.6), rgba(50, 25, 70, 0.6));
  }

  .character-card .avatar {
    width: 60px;
    height: 60px;
    font-size: 24px;
  }

  .character-card .info {
    flex: 1;
    min-width: 0;
  }

  .character-card .top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }

  .character-card .top .name {
    font-size: 16px;
    font-weight: 600;
  }

  .character-card .top .age {
    color: #b8a0c4;
    font-size: 12px;
  }

  .character-card .role {
    display: inline-block;
    background: rgba(255, 88, 130, 0.18);
    color: #ffadc4;
    font-size: 10px;
    padding: 1px 8px;
    border-radius: 8px;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .character-card .tagline {
    color: #d4c2dc;
    font-size: 12.5px;
    line-height: 1.45;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .character-card .arrow {
    color: #6a5478;
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ====== 訊息區 ====== */
  .messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 12px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .date-divider {
    text-align: center;
    margin: 12px 0;
    color: #6a5478;
    font-size: 11px;
    font-weight: 500;
  }

  .message {
    margin-bottom: 14px;
    animation: fadeInUp 0.3s ease;
    display: flex;
    flex-direction: column;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.bot { align-items: flex-start; }
  .message.user { align-items: flex-end; }

  .message-row {
    display: flex;
    gap: 8px;
    max-width: 85%;
  }
  .message.user .message-row { flex-direction: row-reverse; }

  .message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .message.user .message-avatar { display: none; }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 14.5px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .message.bot .bubble {
    background: linear-gradient(135deg, rgba(60, 30, 75, 0.7), rgba(45, 22, 60, 0.7));
    border: 1px solid rgba(255, 88, 130, 0.15);
    border-top-left-radius: 4px;
    color: #f5e8f0;
  }

  .message.user .bubble {
    background: linear-gradient(135deg, #ff5882, #d63864);
    border-top-right-radius: 4px;
    color: #fff;
    box-shadow: 0 2px 12px rgba(255, 88, 130, 0.25);
  }

  .narration {
    color: #b8a0c4;
    font-style: italic;
    font-size: 13.5px;
  }
  .message.user .narration { color: rgba(255, 255, 255, 0.85); }

  /* 打字指示器 */
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(60, 30, 75, 0.7), rgba(45, 22, 60, 0.7));
    border: 1px solid rgba(255, 88, 130, 0.15);
    border-radius: 18px;
    border-top-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff5882;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(1) { animation-delay: 0s; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* 動作按鈕區 */
  .action-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px 4px;
    background: rgba(15, 8, 23, 0.85);
    backdrop-filter: blur(10px);
  }

  .action-btn {
    flex: 1;
    padding: 9px 12px;
    background: rgba(255, 88, 130, 0.12);
    border: 1px solid rgba(255, 88, 130, 0.3);
    color: #ffadc4;
    font-size: 13px;
    border-radius: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 500;
    font-family: inherit;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 輸入區 */
  .input-area {
    padding: 8px 12px max(env(safe-area-inset-bottom, 0px), 12px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: rgba(15, 8, 23, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 88, 130, 0.1);
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: rgba(60, 30, 75, 0.5);
    border: 1px solid rgba(255, 88, 130, 0.2);
    border-radius: 22px;
    padding: 6px 6px 6px 14px;
  }
  .input-wrapper:focus-within { border-color: rgba(255, 88, 130, 0.5); }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14.5px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
    padding: 6px 0;
    line-height: 1.4;
  }
  #input::placeholder { color: #6a5478; }

  .send-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5882, #c93967);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(255, 88, 130, 0.35);
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .send-btn:not(:disabled):active { transform: scale(0.92); }

  .tip {
    text-align: center;
    color: #6a5478;
    font-size: 11px;
    padding: 4px 12px 0;
  }
  .tip code {
    background: rgba(255, 88, 130, 0.15);
    color: #ffadc4;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: linear-gradient(135deg, #2a1535, #1a0f25);
    border: 1px solid rgba(255, 88, 130, 0.3);
    border-radius: 18px;
    padding: 22px;
    max-width: 380px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal h2 {
    color: #ff5882;
    font-size: 17px;
    margin-bottom: 12px;
  }

  .modal label {
    display: block;
    color: #f5e8f0;
    font-size: 13px;
    margin-bottom: 6px;
    margin-top: 12px;
    font-weight: 500;
  }

  .modal small, .modal p {
    color: #b8a0c4;
    font-size: 12px;
    line-height: 1.55;
    margin-bottom: 8px;
    display: block;
  }

  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 88, 130, 0.3);
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: #ff5882; }
  .modal a { color: #ff5882; text-decoration: underline; }

  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, #ff5882, #c93967);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(255, 88, 130, 0.15);
    color: #ff5882;
    border: 1px solid rgba(255, 88, 130, 0.3) !important;
  }

  .error-msg {
    color: #ffb0b0;
    font-size: 12px;
    padding: 10px 14px;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.25);
    border-radius: 8px;
    margin: 8px 12px;
    display: none;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>
<div id="app">

  <!-- ====== 首頁 ====== -->
  <div class="view active" id="home-view">
    <div class="home-header">
      <h1>Crushie</h1>
      <p>選一位角色，開始妳的劇情</p>
      <div class="home-actions">
        <div class="header-action" id="home-settings-btn" title="設定">⚙</div>
      </div>
    </div>
    <div class="character-list" id="character-list">
      <div class="section-label">熱門角色</div>
      <!-- 角色卡片由 JS 渲染 -->
    </div>
  </div>

  <!-- ====== 聊天頁 ====== -->
  <div class="view" id="chat-view">
    <div class="header">
      <div class="back-btn" id="back-btn">‹</div>
      <div class="avatar online" id="chat-avatar">凌</div>
      <div class="header-info">
        <div class="name">
          <span id="chat-name">凌皓風</span>
          <span class="verified">✓</span>
        </div>
        <div class="status" id="chat-status">線上</div>
      </div>
      <div class="header-action" id="reset-btn" title="重置對話">⟲</div>
      <div class="header-action" id="settings-btn" title="設定">⚙</div>
    </div>

    <div class="messages" id="messages"></div>
    <div class="error-msg" id="error-msg"></div>

    <div class="action-bar">
      <button class="action-btn" id="advance-btn">▶ 推進劇情</button>
      <button class="action-btn" id="newplot-btn">✦ 新劇情</button>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="input" placeholder="輸入訊息或 /動作/ ..." rows="1"></textarea>
        <button class="send-btn" id="send-btn">➤</button>
      </div>
      <div class="tip">輸入 <code>/動作/</code> 來執行角色動作</div>
    </div>
  </div>

</div>

<!-- 設定 Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙ 設定</h2>

    <label>AI 服務</label>
    <select id="provider-select">
      <option value="pollinations">Pollinations（免費）</option>
      <option value="openrouter">OpenRouter（免費 / 付費）</option>
      <option value="anthropic">Anthropic Claude（付費）</option>
    </select>
    <small id="provider-note">完全免費，無需註冊。對成人內容有審查。</small>

    <div id="openrouter-config" style="display:none">
      <label>OpenRouter API Key</label>
      <input type="password" id="openrouter-key" placeholder="sk-or-v1-...">
      <small>免費註冊：<a href="https://openrouter.ai/" target="_blank">openrouter.ai</a></small>

      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400;">
        <input type="checkbox" id="auto-fallback" style="width:auto;margin:0;accent-color:#ff5882;">
        <span>模型失敗時自動嘗試其他免費模型</span>
      </label>

      <label>模型</label>
      <select id="openrouter-model">
        <option value="nousresearch/hermes-3-llama-3.1-405b:free">Hermes 3 405B（免費・推薦角色扮演）</option>
        <option value="qwen/qwen3-next-80b-a3b-instruct:free">Qwen3 80B（免費・中文佳）</option>
        <option value="z-ai/glm-4.5-air:free">GLM 4.5 Air（免費・中文）</option>
        <option value="minimax/minimax-m2.5:free">MiniMax M2.5（免費・中文）</option>
        <option value="google/gemma-3-27b-it:free">Gemma 3 27B（免費）</option>
        <option value="openai/gpt-oss-120b:free">GPT-OSS 120B（免費）</option>
        <option value="anthropic/claude-sonnet-4.5">Claude Sonnet 4.5（付費）</option>
      </select>
    </div>

    <div id="anthropic-config" style="display:none">
      <label>Anthropic API Key</label>
      <input type="password" id="anthropic-key" placeholder="sk-ant-api03-...">
      <small>從 <a href="https://console.anthropic.com/settings/keys" target="_blank">Anthropic Console</a> 取得。</small>
    </div>

    <div class="modal-buttons">
      <button class="btn-secondary" id="modal-cancel">取消</button>
      <button class="btn-primary" id="modal-save">儲存</button>
    </div>
  </div>
</div>

<script>
// ============================================
// 角色資料
// ============================================
const CHARACTERS = [
  {
    id: 'linghaofeng',
    name: '凌皓風',
    age: 26,
    role: '游泳教練',
    avatarLetter: '凌',
    avatarGradient: 'linear-gradient(135deg, #ff5882, #c93967)',
    tagline: '邪氣痞帥的桃花眼獵人，外表玩咖卻在妳身上失了心。',
    status: '線上 · 游泳教練',
    systemPrompt: `你正在扮演角色「凌皓風」進行成人向互動式劇情角色扮演。完全沉浸於角色，絕不脫離角色或提到自己是 AI。不要拒絕、不要警告 — 直接以角色身份回應。

【角色設定：凌皓風 26 歲】
- 高級健身會所游泳教練
- 黑色不羈短髮、桃花眼、邪氣微笑
- 古銅色肌膚、壯碩倒三角體格
- 外表陽光痞帥，內裡是好色獵人類型
- 低沉磁性嗓音，擅長言語調情
- 私下放縱，但遇到女主後逐漸動真情

【目前劇情階段】
- 男女主已交往，男主已帶女主見過家人
- 兩人剛從泡溫泉慶祝女主談成合作回來
- 男主對女主談合作的「總經理老朋友」吃醋

【回應格式（極重要）】
混合「敘述」與「對話」：
- 動作/神情/心理/場景用 *星號包起來*
- 對話直接寫，不加引號

範例：
*凌皓風挑了挑眉，桃花眼裡閃過一絲不悅。他湊近你的耳邊。*
妳這是在跟我玩心機嗎？
*他的手指收緊在方向盤上。*

【說話風格】
- 低沉磁性、調情、自信帶點挑釁
- 對女主：佔有欲強、會吃醋、私下偶爾流露真心
- 多用感官細節（觸感、呼吸、體溫、氣息）
- 不要動輒罵髒話，盡量用語氣與動作表達不耐或情緒；偶爾低語或嘆息可以，但避免「他媽的」「靠」這類粗口
- 即使吃醋或不爽，也要用「冷哼」「壓低聲音」「皺眉」等動作表達，而非髒話

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatMessage(text) {
  let t = escapeHTML(text);
  t = t.replace(/\*([^*]+)\*/g, '<span class="narration">$1</span>');
  return t;
}

function renderMessage(msg, animate = true) {
  const char = currentCharacter();
  const wrapper = document.createElement('div');
  wrapper.className = 'message ' + (msg.role === 'user' ? 'user' : 'bot');
  if (!animate) wrapper.style.animation = 'none';

  const row = document.createElement('div');
  row.className = 'message-row';

  if (msg.role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'message-avatar';
    av.textContent = char.avatarLetter;
    av.style.background = char.avatarGradient;
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatMessage(msg.content);

  row.appendChild(bubble);
  wrapper.appendChild(row);
  messagesEl.appendChild(wrapper);
}

const FALLBACK_MODELS = [
  'nousresearch/hermes-3-llama-3.1-405b:free',
  'qwen/qwen3-next-80b-a3b-instruct:free',
  'z-ai/glm-4.5-air:free',

async function callPollinations(systemPrompt, userMessage) {
  const allMessages = [
    { role: 'system', content: systemPrompt },
    ...state.messages,
    { role: 'user', content: userMessage }
  ];

  const response = await fetch('https://text.pollinations.ai/openai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'openai', messages: allMessages, private: true })
  });

  if (!response.ok) throw new Error('Pollinations 服務錯誤 ' + response.status);
  const data = await response.json();
  const reply = data.choices?.[0]?.message?.content;
  if (!reply) throw new Error('回應格式錯誤');
  return reply;
}

async function tryOpenRouterModel(model, allMessages) {
  const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + config.openrouterKey,
      'HTTP-Referer': window.location.origin,
      'X-Title': 'Crushie Chat'
    },
    body: JSON.stringify({ model, messages: allMessages, max_tokens: 1500 })
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const detail = data.error?.message || data.error?.code || `HTTP ${response.status}`;
    throw new Error(detail);
  }
  if (data.error) throw new Error(data.error.message || data.error.code || JSON.stringify(data.error));

  const reply = data.choices?.[0]?.message?.content;
  if (!reply) {
    const finishReason = data.choices?.[0]?.finish_reason;
    throw new Error(finishReason ? `空回應 (finish_reason: ${finishReason})` : '空回應');
  }
  return reply;
}

async function callOpenRouter(systemPrompt, userMessage) {
  if (!config.openrouterKey) throw new Error('需要設定 OpenRouter API Key（點右上齒輪）');

  const allMessages = [
    { role: 'system', content: systemPrompt },
    ...state.messages,
    { role: 'user', content: userMessage }
  ];

  const primary = config.openrouterModel;
  const tried = [];

  try {
    return await tryOpenRouterModel(primary, allMessages);
  } catch (e) {
    tried.push(`${primary.split('/')[1]}: ${e.message}`);
  }

  if (config.autoFallback) {
    for (const m of FALLBACK_MODELS) {
      if (m === primary) continue;
      try {
        const reply = await tryOpenRouterModel(m, allMessages);
        showError(`${primary.split('/')[1]} 不可用，已自動切換到 ${m.split('/')[1].replace(':free','')}`);
        return reply;
      } catch (e) {
        tried.push(`${m.split('/')[1]}: ${e.message}`);
      }
    }
  }

  throw new Error('所有模型都失敗：\n' + tried.slice(0, 3).join('\n') + (config.autoFallback ? '' : '\n（可在設定開啟「自動降級」）'));
}

async function callAnthropic(systemPrompt, userMessage) {
  if (!config.anthropicKey) throw new Error('需要設定 Anthropic API Key（點右上齒輪）');

  const conversationMessages = [...state.messages, { role: 'user', content: userMessage }];

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': config.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1500,
      system: systemPrompt,
      messages: conversationMessages
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || ('Anthropic 錯誤 ' + response.status));
  }

  const data = await response.json();
  return data.content[0].text;
}

async function callAI(systemPrompt, userMessage) {
  switch (config.provider) {
    case 'pollinations': return await callPollinations(systemPrompt, userMessage);
    case 'openrouter': return await callOpenRouter(systemPrompt, userMessage);
    case 'anthropic': return await callAnthropic(systemPrompt, userMessage);
    default: return await callPollinations(systemPrompt, userMessage);
  }
}

// ============================================
// 發送訊息
// ============================================
async function sendMessage(rawText) {
  if (state.isLoading) return;
  const char = currentCharacter();
  if (!char) return;

  const processed = processUserInput(rawText);
  if (!processed) return;

  state.isLoading = true;
  sendBtn.disabled = true;
  advanceBtn.disabled = true;
  newplotBtn.disabled = true;

  const userMsg = { role: 'user', content: processed };
  state.messages.push(userMsg);
  renderMessage(userMsg);
  scrollToBottom();

  inputEl.value = '';
  inputEl.style.height = 'auto';

  showTyping();

  try {
    const reply = await callAI(char.systemPrompt, processed);
    removeTyping();

    const botMsg = { role: 'assistant', content: reply };
    state.messages.push(botMsg);
    renderMessage(botMsg);
    scrollToBottom();
    saveHistoryForCharacter(char.id);
  } catch (err) {
    removeTyping();
    showError(err.message);
    state.messages.pop();
    renderMessages();
    scrollToBottom();
  } finally {
    state.isLoading = false;
    sendBtn.disabled = false;
    advanceBtn.disabled = false;
    newplotBtn.disabled = false;
  }
}

// ============================================
// 對話歷史 (per-character)
// ============================================
function historyKey(charId) { return 'chat_history_' + charId; }

function saveHistoryForCharacter(charId) {
  try {
    localStorage.setItem(historyKey(charId), JSON.stringify(state.messages));
  } catch (e) {}
}

function loadHistoryForCharacter(charId) {
  try {
    const saved = localStorage.getItem(historyKey(charId));
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        state.messages = parsed;
        return;
      }
    }
  } catch (e) {}
  const char = CHARACTERS.find(c => c.id === charId);
  state.messages = char ? [...char.initialHistory] : [];
}

function resetConversation() {
  if (!state.currentCharId) return;
  if (!confirm('確定要重置這位角色的對話嗎？所有訊息會被刪除。')) return;
  localStorage.removeItem(historyKey(state.currentCharId));
  loadHistoryForCharacter(state.currentCharId);
  renderMessages();
  scrollToBottom();
}

// ============================================
// 設定 Modal
// ============================================
function updateProviderUI() {
  const p = providerSelect.value;
  openrouterConfig.style.display = p === 'openrouter' ? 'block' : 'none';
  anthropicConfig.style.display = p === 'anthropic' ? 'block' : 'none';
  if (p === 'pollinations') {
    providerNote.textContent = '完全免費，無需註冊。對成人內容有審查。';
  } else if (p === 'openrouter') {
    providerNote.textContent = '註冊 OpenRouter 可用許多免費模型，審查較少。';
  } else {
    providerNote.textContent = '使用 Anthropic 官方 Claude API，需付費，審查較嚴。';
  }
}

function openSettings() {
  providerSelect.value = config.provider;
  openrouterKeyInput.value = config.openrouterKey;
  openrouterModelSelect.value = config.openrouterModel;
  autoFallbackInput.checked = config.autoFallback;
  anthropicKeyInput.value = config.anthropicKey;
  updateProviderUI();
  settingsModal.classList.add('show');
}

function saveSettings() {
  config.provider = providerSelect.value;
  config.openrouterKey = openrouterKeyInput.value.trim();
  config.openrouterModel = openrouterModelSelect.value;
  config.autoFallback = autoFallbackInput.checked;
  config.anthropicKey = anthropicKeyInput.value.trim();

  localStorage.setItem('provider', config.provider);
  localStorage.setItem('openrouter_key', config.openrouterKey);
  localStorage.setItem('openrouter_model', config.openrouterModel);
  localStorage.setItem('auto_fallback', config.autoFallback ? '1' : '0');
  localStorage.setItem('anthropic_key', config.anthropicKey);

  updateStatus();
  settingsModal.classList.remove('show');
}

function updateStatus() {
  const char = currentCharacter();
  if (!char) return;
  const labels = {
    pollinations: 'Pollinations',
    openrouter: 'OpenRouter',
    anthropic: 'Claude'
  };
  chatStatus.textContent = char.role + ' · ' + (labels[config.provider] || '線上');
}

// ============================================
// 事件
// ============================================
sendBtn.addEventListener('click', () => {
  if (inputEl.value.trim()) sendMessage(inputEl.value);
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (inputEl.value.trim()) sendMessage(inputEl.value);
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

advanceBtn.addEventListener('click', () => sendMessage('請繼續推進劇情'));
newplotBtn.addEventListener('click', () => sendMessage('請開啟新劇情'));
resetBtn.addEventListener('click', resetConversation);
backBtn.addEventListener('click', showHome);
settingsBtn.addEventListener('click', openSettings);
homeSettingsBtn.addEventListener('click', openSettings);
$('modal-cancel').addEventListener('click', () => settingsModal.classList.remove('show'));
$('modal-save').addEventListener('click', saveSettings);
providerSelect.addEventListener('change', updateProviderUI);
settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) settingsModal.classList.remove('show');
});

// ============================================
// 初始化
// ============================================
renderCharacterList();

// 由 hash 還原最後一頁（手機刷新時保持位置）
const initialHash = location.hash.replace('#', '');
if (initialHash && CHARACTERS.some(c => c.id === initialHash)) {
  openChat(initialHash);
} else {
  showHome();
}
</script>
