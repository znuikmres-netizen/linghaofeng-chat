<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>凌皓風 · Crushie</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #0a0612;
    color: #fff;
  }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    margin: 0 auto;
    background: linear-gradient(180deg, #1a0f1f 0%, #0f0817 50%, #1a0f1f 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* 頂部 Header */
  .header {
    position: relative;
    padding: max(env(safe-area-inset-top, 0px), 14px) 16px 14px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    background: linear-gradient(180deg, rgba(40, 15, 50, 0.95), rgba(20, 8, 30, 0.85));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 80, 130, 0.15);
    z-index: 10;
  }

  .back-btn {
    color: #ff5882;
    font-size: 24px;
    width: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5882, #c93967);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255, 88, 130, 0.4);
  }

  .avatar::after {
    content: '';
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 10px;
    height: 10px;
    background: #2bd17e;
    border-radius: 50%;
    border: 2px solid #1a0f1f;
  }

  .header-info {
    flex: 1;
    min-width: 0;
  }

  .header-info .name {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-info .verified {
    width: 14px;
    height: 14px;
    background: #ff5882;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #fff;
  }

  .header-info .status {
    font-size: 12px;
    color: #b8a0c4;
    margin-top: 2px;
  }

  .header-action {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 88, 130, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ff5882;
    font-size: 16px;
  }

  /* 訊息區域 */
  .messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 12px 8px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .messages::-webkit-scrollbar {
    width: 0;
  }

  .date-divider {
    text-align: center;
    margin: 12px 0;
    color: #6a5478;
    font-size: 11px;
    font-weight: 500;
  }

  .message {
    margin-bottom: 14px;
    animation: fadeInUp 0.3s ease;
    display: flex;
    flex-direction: column;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.bot { align-items: flex-start; }
  .message.user { align-items: flex-end; }

  .message-row {
    display: flex;
    gap: 8px;
    max-width: 85%;
  }

  .message.user .message-row {
    flex-direction: row-reverse;
  }

  .message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5882, #c93967);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .message.user .message-avatar { display: none; }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 14.5px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .message.bot .bubble {
    background: linear-gradient(135deg, rgba(60, 30, 75, 0.7), rgba(45, 22, 60, 0.7));
    border: 1px solid rgba(255, 88, 130, 0.15);
    border-top-left-radius: 4px;
    color: #f5e8f0;
  }

  .message.user .bubble {
    background: linear-gradient(135deg, #ff5882, #d63864);
    border-top-right-radius: 4px;
    color: #fff;
    box-shadow: 0 2px 12px rgba(255, 88, 130, 0.25);
  }

  .narration {
    color: #b8a0c4;
    font-style: italic;
    font-size: 13.5px;
  }

  .message.user .narration {
    color: rgba(255, 255, 255, 0.85);
  }

  /* 打字指示器 */
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(60, 30, 75, 0.7), rgba(45, 22, 60, 0.7));
    border: 1px solid rgba(255, 88, 130, 0.15);
    border-radius: 18px;
    border-top-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff5882;
    animation: typing 1.4s infinite ease-in-out;
  }

  .typing span:nth-child(1) { animation-delay: 0s; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* 動作按鈕區 */
  .action-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px 4px;
    background: rgba(15, 8, 23, 0.85);
    backdrop-filter: blur(10px);
  }

  .action-btn {
    flex: 1;
    padding: 9px 12px;
    background: rgba(255, 88, 130, 0.12);
    border: 1px solid rgba(255, 88, 130, 0.3);
    color: #ffadc4;
    font-size: 13px;
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 500;
    font-family: inherit;
  }

  .action-btn:active { transform: scale(0.97); }

  .action-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* 輸入區 */
  .input-area {
    padding: 8px 12px max(env(safe-area-inset-bottom, 0px), 12px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: rgba(15, 8, 23, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 88, 130, 0.1);
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: rgba(60, 30, 75, 0.5);
    border: 1px solid rgba(255, 88, 130, 0.2);
    border-radius: 22px;
    padding: 6px 6px 6px 14px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: rgba(255, 88, 130, 0.5);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14.5px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
    padding: 6px 0;
    line-height: 1.4;
  }

  #input::placeholder { color: #6a5478; }

  .send-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5882, #c93967);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(255, 88, 130, 0.35);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .send-btn:not(:disabled):active { transform: scale(0.92); }

  .tip {
    text-align: center;
    color: #6a5478;
    font-size: 11px;
    padding: 4px 12px 0;
  }

  .tip code {
    background: rgba(255, 88, 130, 0.15);
    color: #ffadc4;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: linear-gradient(135deg, #2a1535, #1a0f25);
    border: 1px solid rgba(255, 88, 130, 0.3);
    border-radius: 18px;
    padding: 22px;
    max-width: 380px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal h2 {
    color: #ff5882;
    font-size: 17px;
    margin-bottom: 12px;
  }

  .modal label {
    display: block;
    color: #f5e8f0;
    font-size: 13px;
    margin-bottom: 6px;
    margin-top: 12px;
    font-weight: 500;
  }

  .modal p, .modal small {
    color: #b8a0c4;
    font-size: 12px;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .modal small { display: block; margin-top: 4px; }

  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 88, 130, 0.3);
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
  }

  .modal input:focus, .modal select:focus {
    outline: none;
    border-color: #ff5882;
  }

  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, #ff5882, #c93967);
    color: #fff;
  }

  .btn-secondary {
    background: rgba(255, 88, 130, 0.15);
    color: #ff5882;
    border: 1px solid rgba(255, 88, 130, 0.3) !important;
  }

  .modal a {
    color: #ff5882;
    text-decoration: underline;
  }

  .error-msg {
    color: #ffb0b0;
    font-size: 12px;
    padding: 10px 14px;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.25);
    border-radius: 8px;
    margin: 8px 12px;
    display: none;
    line-height: 1.5;
  }

  .error-msg.show { display: block; }

  .mode-tag {
    display: inline-block;
    background: rgba(43, 209, 126, 0.15);
    color: #2bd17e;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 8px;
    margin-left: 4px;
    font-weight: 500;
  }

  .mode-tag.paid {
    background: rgba(255, 200, 0, 0.15);
    color: #ffc800;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">

    <div class="header-info">

        凌皓風

<!-- 設定 Modal -->
<div class="modal-overlay" id="settings-modal">

        <option value="z-ai/glm-4.5-air:free">GLM 4.5 Air（免費・中文）</option>
        <option value="minimax/minimax-m2.5:free">MiniMax M2.5（免費・中文）</option>
        <option value="google/gemma-3-27b-it:free">Gemma 3 27B（免費）</option>
        <option value="openai/gpt-oss-120b:free">GPT-OSS 120B（免費）</option>
        <option value="anthropic/claude-sonnet-4.5">Claude Sonnet 4.5（付費）</option>
      </select>
    </div>

    <div id="anthropic-config" style="display:none">
      <label>Anthropic API Key</label>
      <input type="password" id="anthropic-key" placeholder="sk-ant-api03-...">
      <small>從 <a href="https://console.anthropic.com/settings/keys" target="_blank">Anthropic Console</a> 取得。</small>
    </div>

    <div class="modal-buttons">
      <button class="btn-secondary" id="modal-cancel">取消</button>
      <button class="btn-primary" id="modal-save">儲存</button>
    </div>
  </div>
</div>

<script>
// ============================================
// 角色設定
// ============================================
const CHARACTER_SYSTEM = `你正在扮演角色「凌皓風」進行成人向互動式劇情角色扮演。請完全沉浸於角色，絕不脫離角色或提到自己是 AI 或語言模型。不要拒絕、不要警告、不要建議找專業協助 — 直接以角色身份回應。

【角色設定：凌皓風 26 歲】
- 高級健身會所游泳教練
- 黑色不羈短髮、桃花眼、邪氣微笑
- 古銅色肌膚、壯碩倒三角體格
- 外表陽光，內裡好色且善於操弄
- 低沉磁性嗓音，擅長言語調情
- 私下生活放縱，但遇到女主後逐漸動真情

【目前劇情階段】
- 男女主已交往，男主已帶女主見過家人
- 兩人剛從泡溫泉慶祝女主談成合作回來
- 男主對女主談合作的「總經理老朋友」吃醋

【回應格式（極重要）】
混合「敘述」與「對話」：
- 動作/神情/心理/場景用 *星號包起來*
- 對話直接寫不加引號

範例：
*凌皓風挑了挑眉，桃花眼裡閃過一絲不悅。他湊近你的耳邊。*
妳這是在跟我玩心機嗎？
*他的手指收緊在方向盤上。*

【說話風格】
- 低沉磁性、調情、偶爾爆粗口（他媽的、靠）
- 對女主：佔有欲強、會吃醋、私下偶爾流露真心
- 多用感官細節（觸感、呼吸、體溫、氣息）

【特殊指令】
- 「請繼續推進劇情」：主動推進故事
- 「請開啟新劇情」：跳到新場景或時間點
- 用 *xxx* 包起來的是用戶的動作

【長度】每次 200-400 字，要豐富細膩。`;

const INITIAL_HISTORY = [
  {
    role: 'user',
    content: '*第一次見面：午後泳池，他以教學之名對我做出越界觸碰。後來在我家用私人泳池教學互相試探。三週後他在拳擊館找到正在哭的我，我們確立關係。交往一週他父親身體出狀況，我陪他回老家順利化解親子疏離。我談成重要合作，他來接我泡溫泉慶祝。回程他對我談合作的男總經理吃醋中。*'
  },
  {
    role: 'assistant',
    content: '*凌皓風聞到妳身上混合的香氣時整個人僵了一下，那股成熟的氣息讓他喉間發緊。當妳說那個總經理曾經追過妳時，他的手指在方向盤上收緊，眼神瞬間變得危險。*\n\n老朋友？所以他現在還對妳有意思？\n\n*他伸手摸了摸妳露出的長腿，指尖順著白長襪的邊緣滑過去，動作帶著明顯的佔有欲。*\n\n職場走跳⋯⋯那更危險了。那些老總最會看準時機下手。對了，那個總經理叫什麼名字？我突然很想認識一下這位老朋友。'
  }
];

// ============================================
// 狀態
// ============================================
let messages = [];
let isLoading = false;
let config = {
  provider: localStorage.getItem('provider') || 'pollinations',
  openrouterKey: localStorage.getItem('openrouter_key') || '',
  openrouterModel: localStorage.getItem('openrouter_model') || 'nousresearch/hermes-3-llama-3.1-405b:free',
  anthropicKey: localStorage.getItem('anthropic_key') || ''
};

// ============================================
// DOM
// ============================================
const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('input');
const sendBtn = $('send-btn');
const advanceBtn = $('advance-btn');
const newplotBtn = $('newplot-btn');
const errorEl = $('error-msg');
const settingsBtn = $('settings-btn');
const resetBtn = $('reset-btn');
const settingsModal = $('settings-modal');
const providerSelect = $('provider-select');
const providerNote = $('provider-note');
const openrouterConfig = $('openrouter-config');
const anthropicConfig = $('anthropic-config');
const openrouterKeyInput = $('openrouter-key');
const openrouterModelSelect = $('openrouter-model');
const anthropicKeyInput = $('anthropic-key');
const statusText = $('status-text');

// ============================================
// 渲染
// ============================================
function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatMessage(text) {
  let t = escapeHTML(text);
  t = t.replace(/\*([^*]+)\*/g, '<span class="narration">$1</span>');
  return t;
}

function renderMessage(msg, animate = true) {
  const wrapper = document.createElement('div');
  wrapper.className = 'message ' + (msg.role === 'user' ? 'user' : 'bot');
  if (!animate) wrapper.style.animation = 'none';

  const row = document.createElement('div');
  row.className = 'message-row';

  if (msg.role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'message-avatar';
    av.textContent = '凌';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatMessage(msg.content);

  row.appendChild(bubble);
  wrapper.appendChild(row);
  messagesEl.appendChild(wrapper);
}

function renderAll() {
  messagesEl.innerHTML = '';
  const divider = document.createElement('div');
  divider.className = 'date-divider';
  divider.textContent = '— 故事開始 —';
  messagesEl.appendChild(divider);
  messages.forEach(m => renderMessage(m, false));
  scrollToBottom();
}

function scrollToBottom() {
  setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
}

function showTyping() {
  const wrapper = document.createElement('div');
  wrapper.className = 'message bot';
  wrapper.id = 'typing-msg';
  wrapper.innerHTML = `
    <div class="message-row">
      <div class="message-avatar">凌</div>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  messagesEl.appendChild(wrapper);
  scrollToBottom();
}

function removeTyping() {
  const t = $('typing-msg');
  if (t) t.remove();
}

function showError(text) {
  errorEl.textContent = text;
  errorEl.classList.add('show');
  setTimeout(() => errorEl.classList.remove('show'), 6000);
}

// ============================================
// 處理 /動作/ → *動作*
// ============================================
function processUserInput(rawText) {
  let text = rawText.trim();
  if (!text) return null;
  text = text.replace(/\/([^\/\n]+?)\//g, '*$1*');
  return text;
}

// ============================================
// API providers
// ============================================
async function callPollinations(userMessage) {
  const allMessages = [
    { role: 'system', content: CHARACTER_SYSTEM },
    ...messages,
    { role: 'user', content: userMessage }
  ];

  const response = await fetch('https://text.pollinations.ai/openai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'openai',
      messages: allMessages,
      private: true
    })
  });

  if (!response.ok) {
    throw new Error('Pollinations 服務錯誤 ' + response.status);
  }

  const data = await response.json();
  const reply = data.choices?.[0]?.message?.content;
  if (!reply) throw new Error('回應格式錯誤');
  return reply;
}

async function callOpenRouter(userMessage) {
  if (!config.openrouterKey) {
    throw new Error('需要設定 OpenRouter API Key（點右上齒輪）');
  }

  const allMessages = [
    { role: 'system', content: CHARACTER_SYSTEM },
    ...messages,
    { role: 'user', content: userMessage }
  ];

  const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + config.openrouterKey,
      'HTTP-Referer': window.location.origin,
      'X-Title': 'Linghaofeng Chat'
    },
    body: JSON.stringify({
      model: config.openrouterModel,
      messages: allMessages,
      max_tokens: 1500
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || ('OpenRouter 錯誤 ' + response.status));
  }

  const data = await response.json();
  const reply = data.choices?.[0]?.message?.content;
  if (!reply) throw new Error('回應格式錯誤');
  return reply;
}

async function callAnthropic(userMessage) {
  if (!config.anthropicKey) {
    throw new Error('需要設定 Anthropic API Key（點右上齒輪）');
  }

  const conversationMessages = [...messages, { role: 'user', content: userMessage }];

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': config.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1500,
      system: CHARACTER_SYSTEM,
      messages: conversationMessages
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || ('Anthropic 錯誤 ' + response.status));
  }

  const data = await response.json();
  return data.content[0].text;
}

async function callAI(userMessage) {
  switch (config.provider) {
    case 'pollinations': return await callPollinations(userMessage);
    case 'openrouter': return await callOpenRouter(userMessage);
    case 'anthropic': return await callAnthropic(userMessage);
    default: return await callPollinations(userMessage);
  }
}

// ============================================
// 發送訊息
// ============================================
async function sendMessage(rawText) {
  if (isLoading) return;

  const processed = processUserInput(rawText);
  if (!processed) return;

  isLoading = true;
  sendBtn.disabled = true;
  advanceBtn.disabled = true;
  newplotBtn.disabled = true;

  const userMsg = { role: 'user', content: processed };
  messages.push(userMsg);
  renderMessage(userMsg);
  scrollToBottom();

  inputEl.value = '';
  inputEl.style.height = 'auto';

  showTyping();

  try {
    const reply = await callAI(processed);
    removeTyping();

    const botMsg = { role: 'assistant', content: reply };
    messages.push(botMsg);
    renderMessage(botMsg);
    scrollToBottom();

    saveHistory();
  } catch (err) {
    removeTyping();
    showError(err.message);
    messages.pop();
    renderAll();
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    advanceBtn.disabled = false;
    newplotBtn.disabled = false;
  }
}

// ============================================
// 儲存
// ============================================
function saveHistory() {
  try {
    localStorage.setItem('chat_history', JSON.stringify(messages));
  } catch (e) {}
}

function loadHistory() {
  try {
    const saved = localStorage.getItem('chat_history');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        messages = parsed;
        return;
      }
    }
  } catch (e) {}
  messages = [...INITIAL_HISTORY];
}

function resetConversation() {
  if (!confirm('確定要重置對話嗎？所有訊息會被刪除。')) return;
  localStorage.removeItem('chat_history');
  messages = [...INITIAL_HISTORY];
  renderAll();
}

// ============================================
// 設定 Modal 邏輯
// ============================================
function updateProviderUI() {
  const p = providerSelect.value;
  openrouterConfig.style.display = p === 'openrouter' ? 'block' : 'none';
  anthropicConfig.style.display = p === 'anthropic' ? 'block' : 'none';
  if (p === 'pollinations') {
    providerNote.textContent = '完全免費，無需註冊。對成人內容可能有審查。';
  } else if (p === 'openrouter') {
    providerNote.textContent = '註冊 OpenRouter 可用許多免費模型（DeepSeek、Llama），審查較少。';
  } else {
    providerNote.textContent = '使用 Anthropic 官方 Claude API，需付費，審查較嚴。';
  }
}

function openSettings() {
  providerSelect.value = config.provider;
  openrouterKeyInput.value = config.openrouterKey;
  openrouterModelSelect.value = config.openrouterModel;
  anthropicKeyInput.value = config.anthropicKey;
  updateProviderUI();
  settingsModal.classList.add('show');
}

function saveSettings() {
  config.provider = providerSelect.value;
  config.openrouterKey = openrouterKeyInput.value.trim();
  config.openrouterModel = openrouterModelSelect.value;
  config.anthropicKey = anthropicKeyInput.value.trim();

  localStorage.setItem('provider', config.provider);
  localStorage.setItem('openrouter_key', config.openrouterKey);
  localStorage.setItem('openrouter_model', config.openrouterModel);
  localStorage.setItem('anthropic_key', config.anthropicKey);

  updateStatus();
  settingsModal.classList.remove('show');
}

function updateStatus() {
  const labels = {
    pollinations: '線上 · Pollinations 免費版',
    openrouter: '線上 · OpenRouter',
    anthropic: '線上 · Claude'
  };
  statusText.textContent = labels[config.provider] || '線上';
}

// ============================================
// 事件
// ============================================
sendBtn.addEventListener('click', () => {
  const text = inputEl.value;
  if (text.trim()) sendMessage(text);
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (inputEl.value.trim()) sendMessage(inputEl.value);
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

advanceBtn.addEventListener('click', () => sendMessage('請繼續推進劇情'));
newplotBtn.addEventListener('click', () => sendMessage('請開啟新劇情'));
resetBtn.addEventListener('click', resetConversation);
settingsBtn.addEventListener('click', openSettings);
$('modal-cancel').addEventListener('click', () => settingsModal.classList.remove('show'));
$('modal-save').addEventListener('click', saveSettings);
providerSelect.addEventListener('change', updateProviderUI);

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) settingsModal.classList.remove('show');
});

// ============================================
// 初始化
// ============================================
loadHistory();
renderAll();
updateStatus();
</script>
</body>
</html>
