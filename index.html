<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crushie · 互動劇情</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #EFEAE2;
    color: #111B21;
  }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    margin: 0 auto;
    background: linear-gradient(180deg, #EFEAE2 0%, #EFEAE2 50%, #EFEAE2 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ====== 通用 Header ====== */
  .header {
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    padding-bottom: 14px;
    padding-left: 16px;
    padding-right: 16px;
    background: linear-gradient(180deg, rgba(0, 128, 105, 0.98), rgba(0, 105, 87, 0.85));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    z-index: 10;
  }

  .back-btn, .header-action {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    color: #FFFFFF;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    transition: background 0.2s;
  }

  .back-btn { font-size: 24px; background: transparent; color: #FFFFFF; }
  .back-btn:active { background: rgba(255, 255, 255, 0.2); }

  .header-info {
    flex: 1;
    min-width: 0;
    color: #FFFFFF;
  }

  .header-info .name {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #FFFFFF;
  }

  .verified {
    width: 14px;
    height: 14px;
    background: #FFFFFF;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #008069;
  }

  .header-info .status {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 2px;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 18px;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(0, 168, 132, 0.35);
    overflow: hidden;
  }

  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .avatar img.loaded {
    opacity: 1;
  }

  .avatar .avatar-letter {
    position: relative;
    z-index: 0;
  }

  .avatar.online::after {
    content: '';
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 10px;
    height: 10px;
    background: #2bd17e;
    border-radius: 50%;
    border: 2px solid #EFEAE2;
    z-index: 3;
  }

  /* ====== 視圖切換 ====== */
  .view {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .view.active {
    display: flex;
  }

  /* ====== 首頁 ====== */
  .home-header {
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 12px;
    background: linear-gradient(180deg, rgba(0, 128, 105, 0.98), rgba(0, 105, 87, 0.85));
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  .home-header h1 {
    font-size: 26px;
    color: #FFFFFF;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .home-header p {
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    margin-top: 4px;
  }

  .home-header .home-actions {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 16px;
  }

  .character-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 24px;
    -webkit-overflow-scrolling: touch;
  }

  .character-list::-webkit-scrollbar { width: 0; }

  .section-label {
    color: #8696A0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 12px 8px 6px;
    text-transform: uppercase;
  }

  .character-card {
    background: #FFFFFF;
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.25s;
    animation: cardIn 0.4s ease backwards;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .character-card:nth-child(2) { animation-delay: 0.05s; }
  .character-card:nth-child(3) { animation-delay: 0.1s; }
  .character-card:nth-child(4) { animation-delay: 0.15s; }

  .character-card:active {
    transform: scale(0.98);
    background: linear-gradient(135deg, rgba(255, 255, 255, 1), rgba(245, 245, 245, 1));
  }

  .character-card .avatar {
    width: 60px;
    height: 60px;
    font-size: 24px;
  }

  .character-card .info {
    flex: 1;
    min-width: 0;
  }

  .character-card .top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }

  .character-card .top .name {
    font-size: 16px;
    font-weight: 600;
  }

  .character-card .top .age {
    color: #667781;
    font-size: 12px;
  }

  .character-card .role {
    display: inline-block;
    background: rgba(0, 168, 132, 0.18);
    color: #25D366;
    font-size: 10px;
    padding: 1px 8px;
    border-radius: 8px;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .character-card .tagline {
    color: #667781;
    font-size: 12.5px;
    line-height: 1.45;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .character-card .arrow {
    color: #8696A0;
    font-size: 18px;
    flex-shrink: 0;
  }

  /* 好感度條 */
  .affection {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #008069;
  }
  .affection-bar {
    flex: 1;
    height: 4px;
    background: rgba(0, 0, 0, 0.06);
    border-radius: 2px;
    overflow: hidden;
    max-width: 120px;
  }
  .affection-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #25D366, #008069);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .affection-text {
    font-weight: 600;
    min-width: 56px;
    text-align: right;
    color: #008069;
  }

  /* 鎖定的角色卡 */
  .character-card.locked {
    opacity: 0.6;
    cursor: not-allowed;
    position: relative;
  }
  .character-card.locked:active { transform: none; }
  .character-card.locked .avatar img {
    filter: grayscale(0.7) blur(1.2px);
  }
  .character-card.locked .lock-icon {
    position: absolute;
    top: 50%;
    left: 30px;
    transform: translateY(-50%);
    font-size: 22px;
    z-index: 5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .unlock-info {
    display: inline-block;
    background: rgba(0, 168, 132, 0.12);
    color: #008069;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-top: 4px;
    font-weight: 500;
  }

  /* Header 上的好感度小標 */
  .header-affection {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    background: rgba(255, 255, 255, 0.18);
    padding: 1px 8px;
    border-radius: 10px;
    margin-left: 6px;
    color: #FFFFFF;
    font-weight: 500;
  }

  /* 好感度變動 toast */
  .affection-toast {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 80px);
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0, 128, 105, 0.95);
    color: #FFFFFF;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 200;
  }
  .affection-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .affection-toast.negative {
    background: rgba(220, 53, 69, 0.95);
  }

  /* ====== 訊息區 ====== */
  .messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 12px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .date-divider {
    text-align: center;
    margin: 12px 0;
    color: #8696A0;
    font-size: 11px;
    font-weight: 500;
  }

  .message {
    margin-bottom: 14px;
    animation: fadeInUp 0.3s ease;
    display: flex;
    flex-direction: column;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.bot { align-items: flex-start; }
  .message.user { align-items: flex-end; }

  .message-row {
    display: flex;
    gap: 8px;
    max-width: 85%;
  }
  .message.user .message-row { flex-direction: row-reverse; }

  .message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .message.user .message-avatar { display: none; }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 14.5px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .message.bot .bubble {
    background: #FFFFFF;
    border: 1px solid rgba(0, 0, 0, 0.04);
    border-top-left-radius: 4px;
    color: #111B21;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
  }

  .message.user .bubble {
    background: #D9FDD3;
    border-top-right-radius: 4px;
    color: #111B21;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
  }

  .narration {
    color: #667781;
    font-style: italic;
    font-size: 13.5px;
  }
  .message.user .narration { color: #54656F; }

  /* 打字指示器 */
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: #FFFFFF;
    border: 1px solid rgba(0, 0, 0, 0.04);
    border-radius: 18px;
    border-top-left-radius: 4px;
    width: fit-content;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
  }
  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00A884;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(1) { animation-delay: 0s; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* 動作按鈕區 */
  .action-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px 4px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
  }

  .action-btn {
    flex: 1;
    padding: 9px 12px;
    background: rgba(0, 168, 132, 0.12);
    border: 1px solid rgba(0, 168, 132, 0.3);
    color: #25D366;
    font-size: 13px;
    border-radius: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 500;
    font-family: inherit;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 輸入區 */
  .input-area {
    padding: 8px 12px max(env(safe-area-inset-bottom, 0px), 12px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0, 168, 132, 0.1);
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: #FFFFFF;
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 22px;
    padding: 6px 6px 6px 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  .input-wrapper:focus-within { border-color: rgba(0, 168, 132, 0.4); }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #111B21;
    font-size: 14.5px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
    padding: 6px 0;
    line-height: 1.4;
  }
  #input::placeholder { color: #8696A0; }

  .send-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00A884, #008069);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(0, 168, 132, 0.35);
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .send-btn:not(:disabled):active { transform: scale(0.92); }

  .tip {
    text-align: center;
    color: #8696A0;
    font-size: 11px;
    padding: 4px 12px 0;
  }
  .tip code {
    background: rgba(0, 168, 132, 0.15);
    color: #25D366;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: linear-gradient(135deg, #FFFFFF, #F0F2F5);
    border: 1px solid rgba(0, 168, 132, 0.3);
    border-radius: 18px;
    padding: 22px;
    max-width: 380px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal h2 {
    color: #00A884;
    font-size: 17px;
    margin-bottom: 12px;
  }

  .modal label {
    display: block;
    color: #111B21;
    font-size: 13px;
    margin-bottom: 6px;
    margin-top: 12px;
    font-weight: 500;
  }

  .modal small, .modal p {
    color: #667781;
    font-size: 12px;
    line-height: 1.55;
    margin-bottom: 8px;
    display: block;
  }

  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    background: #F0F2F5;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 10px;
    color: #111B21;
    font-size: 13px;
    font-family: inherit;
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: #00A884; }
  .modal a { color: #00A884; text-decoration: underline; }

  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, #00A884, #008069);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(0, 168, 132, 0.15);
    color: #00A884;
    border: 1px solid rgba(0, 168, 132, 0.3) !important;
  }

  .error-msg {
    color: #ffb0b0;
    font-size: 12px;
    padding: 10px 14px;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.25);
    border-radius: 8px;
    margin: 8px 12px;
    display: none;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>
<div id="app">

  <!-- ====== 首頁 ====== -->
  <div class="view active" id="home-view">
    <div class="home-header">
      <h1>Crushie</h1>
      <p>選一位角色，開始妳的劇情</p>
      <div class="home-actions">
        <div class="header-action" id="home-settings-btn" title="設定">⚙</div>
      </div>
    </div>
    <div class="character-list" id="character-list">
      <div class="section-label">熱門角色</div>
      <!-- 角色卡片由 JS 渲染 -->
    </div>
  </div>

  <!-- ====== 聊天頁 ====== -->
  <div class="view" id="chat-view">
    <div class="header">
      <div class="back-btn" id="back-btn">‹</div>
      <div class="avatar online" id="chat-avatar">凌</div>
      <div class="header-info">
        <div class="name">
          <span id="chat-name">凌皓風</span>
          <span class="verified">✓</span>
        </div>
        <div class="status" id="chat-status">線上</div>
      </div>
      <div class="header-action" id="reset-btn" title="重置對話">⟲</div>
      <div class="header-action" id="settings-btn" title="設定">⚙</div>
    </div>

    <div class="messages" id="messages"></div>
    <div class="error-msg" id="error-msg"></div>

    <div class="action-bar">
      <button class="action-btn" id="advance-btn">▶ 推進劇情</button>
      <button class="action-btn" id="newplot-btn">✦ 新劇情</button>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="input" placeholder="輸入訊息或 /動作/ ..." rows="1"></textarea>
        <button class="send-btn" id="send-btn">➤</button>
      </div>
      <div class="tip">輸入 <code>/動作/</code> 來執行角色動作</div>
    </div>
  </div>

</div>

<!-- 設定 Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙ 設定</h2>

    <label>AI 服務</label>
    <select id="provider-select">
      <option value="pollinations">Pollinations（免費）</option>
      <option value="openrouter">OpenRouter（免費 / 付費）</option>
      <option value="anthropic">Anthropic Claude（付費）</option>
    </select>
    <small id="provider-note">完全免費，無需註冊。對成人內容有審查。</small>

    <div id="openrouter-config" style="display:none">
      <label>OpenRouter API Key</label>
      <input type="password" id="openrouter-key" placeholder="sk-or-v1-...">
      <small>免費註冊：<a href="https://openrouter.ai/" target="_blank">openrouter.ai</a></small>

      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400;">
        <input type="checkbox" id="auto-fallback" style="width:auto;margin:0;accent-color:#00A884;">
        <span>模型失敗時自動嘗試其他免費模型</span>
      </label>

      <label>模型</label>
      <select id="openrouter-model">
        <option value="nousresearch/hermes-3-llama-3.1-405b:free">Hermes 3 405B（免費・推薦角色扮演）</option>
        <option value="qwen/qwen3-next-80b-a3b-instruct:free">Qwen3 80B（免費・中文佳）</option>
        <option value="z-ai/glm-4.5-air:free">GLM 4.5 Air（免費・中文）</option>
        <option value="minimax/minimax-m2.5:free">MiniMax M2.5（免費・中文）</option>
        <option value="google/gemma-3-27b-it:free">Gemma 3 27B（免費）</option>
        <option value="openai/gpt-oss-120b:free">GPT-OSS 120B（免費）</option>
        <option value="anthropic/claude-sonnet-4.5">Claude Sonnet 4.5（付費）</option>
      </select>
    </div>

    <div id="anthropic-config" style="display:none">
      <label>Anthropic API Key</label>
      <input type="password" id="anthropic-key" placeholder="sk-ant-api03-...">
      <small>從 <a href="https://console.anthropic.com/settings/keys" target="_blank">Anthropic Console</a> 取得。</small>
    </div>

    <div class="modal-buttons">
      <button class="btn-secondary" id="modal-cancel">取消</button>

// 取得目前角色
// ============================================
function currentCharacter() {
  return CHARACTERS.find(c => c.id === state.currentCharId);
}

// ============================================
// 角色頭像
// 優先用預生成的本地圖片（assets/avatars/{id}.jpg）
// 找不到時 fallback 到 Pollinations 即時生成
// ============================================
function characterAvatarUrl(char) {
  return `assets/avatars/${char.id}.jpg`;
}

function characterAvatarFallbackUrl(char) {
  if (!char.avatarPrompt) return null;
  const enc = encodeURIComponent(char.avatarPrompt);
  return `https://image.pollinations.ai/prompt/${enc}?width=400&height=400&model=flux&seed=${char.avatarSeed || 1}&nologo=true&enhance=false`;
}

function avatarHTML(char) {
  const local = characterAvatarUrl(char);
  const fallback = characterAvatarFallbackUrl(char);
  const onerror = fallback
    ? `if(this.dataset.fb)return;this.dataset.fb=1;this.src='${fallback}'`
    : `this.style.display='none'`;
  return `<img src="${local}" alt="${char.name}" onload="this.classList.add('loaded')" onerror="${onerror}"><span class="avatar-letter">${char.avatarLetter}</span>`;
}

// ============================================
// 解鎖系統 + 好感度系統
// ============================================
const AFFECTION_MAX = 1000;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function isUnlocked(char) {
  if (!char.unlockDate) return true;
  return char.unlockDate <= todayStr();
}

function unlockDateLabel(char) {
  if (!char.unlockDate) return '';
  const [y, m, d] = char.unlockDate.split('-');
  return `${parseInt(m)}/${parseInt(d)} 解鎖`;
}

function getAffection(charId) {
  try {
    const v = parseInt(localStorage.getItem('affection_' + charId) || '0', 10);
    if (isNaN(v)) return 0;
    return Math.max(0, Math.min(AFFECTION_MAX, v));
  } catch (e) { return 0; }
}

function setAffection(charId, value) {
  const v = Math.max(0, Math.min(AFFECTION_MAX, value));
  try { localStorage.setItem('affection_' + charId, String(v)); } catch (e) {}
  return v;
}

function calcAffectionDelta(userText) {
  const POSITIVE = ['愛', '喜歡', '寶貝', '抱', '親', '撫摸', '溫柔', '想你', '想念', '甜', '寵', '撒嬌', '一起', '陪我', '陪你', '謝謝', '辛苦', '心動', '幸福', '開心', '想吃'];
  const FLIRTY = ['壞', '誘', '挑逗', '撩', '勾引', '貼著', '靠著', '趴在', '吻', '舔', '咬', '靠近', '誘惑'];
  const ARGUMENT = ['討厭', '走開', '滾', '分手', '別碰', '煩死', '夠了', '我恨', '不要再', '吵', '混蛋', '王八蛋'];

  let score = 5; // base

  // 長度加分
  if (userText.length > 100) score += 5;
  else if (userText.length > 40) score += 3;
  else if (userText.length > 15) score += 1;

  // 正向關鍵字
  for (const w of POSITIVE) if (userText.includes(w)) { score += 2; }
  for (const w of FLIRTY) if (userText.includes(w)) { score += 3; }

  // 動作（/.../）加分
  const actions = userText.match(/\*[^*]+\*/g) || [];
  score += Math.min(actions.length * 2, 6);

  // 推進/新劇情
  if (userText.includes('推進劇情') || userText.includes('新劇情')) score += 2;

  // 吵架關鍵字扣分
  let argueHits = 0;
  for (const w of ARGUMENT) if (userText.includes(w)) argueHits++;
  if (argueHits > 0) score = -8 - argueHits * 4;

  // clamp -20 ~ 20
  return Math.max(-20, Math.min(20, score));
}

function showAffectionToast(delta) {
  let toast = document.getElementById('affection-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'affection-toast';
    toast.className = 'affection-toast';
    document.body.appendChild(toast);
  }
  const sign = delta >= 0 ? '+' : '';
  toast.textContent = `好感度 ${sign}${delta} ${delta >= 0 ? '💚' : '💔'}`;
  toast.classList.toggle('negative', delta < 0);
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function applyAffection(charId, userText) {
  const delta = calcAffectionDelta(userText);
  const oldVal = getAffection(charId);
  const newVal = setAffection(charId, oldVal + delta);
  if (newVal !== oldVal) showAffectionToast(newVal - oldVal);
  updateChatHeaderAffection();
  return newVal;
}

function updateChatHeaderAffection() {
  const char = currentCharacter();
  if (!char) return;
  const aff = getAffection(char.id);
  const labels = {
    pollinations: 'Pollinations',
    openrouter: 'OpenRouter',
    anthropic: 'Claude'
  };
  chatStatus.innerHTML = `${char.role} · ${labels[config.provider] || '線上'}<span class="header-affection">💚 ${aff}/${AFFECTION_MAX}</span>`;
}

// ============================================
// 渲染：首頁角色列表
// ============================================
function renderCharacterList() {
  const label = characterListEl.querySelector('.section-label');
  characterListEl.innerHTML = '';
  if (label) characterListEl.appendChild(label);

  CHARACTERS.forEach(char => {
    const unlocked = isUnlocked(char);
    const aff = getAffection(char.id);
    const affPercent = Math.round((aff / AFFECTION_MAX) * 100);

    const card = document.createElement('div');
    card.className = 'character-card' + (unlocked ? '' : ' locked');

    const affectionBlock = unlocked ? `
      <div class="affection">
        <div class="affection-bar">
          <div class="affection-bar-fill" style="width:${affPercent}%"></div>
        </div>
        <span class="affection-text">💚 ${aff}/${AFFECTION_MAX}</span>
      </div>
    ` : '';

    const lockBlock = unlocked ? '' : `
      <div class="lock-icon">🔒</div>
      <span class="unlock-info">${unlockDateLabel(char)}</span>
    `;

    card.innerHTML = `
      <div class="avatar online" style="background:${char.avatarGradient}">${avatarHTML(char)}</div>
      <div class="info">
        <div class="top">
          <span class="name">${char.name}</span>
          <span class="age">· ${char.age}歲</span>
        </div>
        <div class="role">${char.role}</div>
        <div class="tagline">${char.tagline}</div>
        ${unlocked ? affectionBlock : lockBlock}
      </div>
      <div class="arrow">${unlocked ? '›' : ''}</div>
    `;
    if (unlocked) {
      card.addEventListener('click', () => openChat(char.id));
    }
    characterListEl.appendChild(card);
  });
}

// ============================================
// 視圖切換
// ============================================
function showHome() {
  state.currentCharId = null;
  state.messages = [];
  homeView.classList.add('active');
  chatView.classList.remove('active');
  history.replaceState(null, '', '#');
}

function openChat(charId) {
  const char = CHARACTERS.find(c => c.id === charId);
  if (!char) return;

  state.currentCharId = charId;

  // 載入該角色的對話歷史
  loadHistoryForCharacter(charId);

  // 更新 header
  chatAvatar.innerHTML = avatarHTML(char);
  chatAvatar.style.background = char.avatarGradient;
  chatName.textContent = char.name;
  updateStatus();

  homeView.classList.remove('active');
  chatView.classList.add('active');
  history.replaceState(null, '', '#' + charId);

  renderMessages();
  scrollToBottom();
}

// ============================================
// 訊息渲染
// ============================================
function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatMessage(text) {
  let t = escapeHTML(text);
  t = t.replace(/\*([^*]+)\*/g, '<span class="narration">$1</span>');
  return t;
}

function renderMessage(msg, animate = true) {
  const char = currentCharacter();
  const wrapper = document.createElement('div');
  wrapper.className = 'message ' + (msg.role === 'user' ? 'user' : 'bot');
  if (!animate) wrapper.style.animation = 'none';

  const row = document.createElement('div');
  row.className = 'message-row';

  if (msg.role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'message-avatar avatar';
    av.style.background = char.avatarGradient;
    av.innerHTML = avatarHTML(char);
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatMessage(msg.content);

  row.appendChild(bubble);
  wrapper.appendChild(row);
  messagesEl.appendChild(wrapper);
}

function renderMessages() {
  messagesEl.innerHTML = '';
  const divider = document.createElement('div');
  divider.className = 'date-divider';
  divider.textContent = '— 故事開始 —';
  messagesEl.appendChild(divider);
  state.messages.forEach(m => renderMessage(m, false));
}

function scrollToBottom() {
  setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
}

function showTyping() {
  const char = currentCharacter();
  const wrapper = document.createElement('div');
  wrapper.className = 'message bot';
  wrapper.id = 'typing-msg';
  wrapper.innerHTML = `
    <div class="message-row">
      <div class="message-avatar avatar" style="background:${char.avatarGradient}">${avatarHTML(char)}</div>
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  messagesEl.appendChild(wrapper);
  scrollToBottom();
}

function removeTyping() {
  const t = $('typing-msg');
  if (t) t.remove();
}

function showError(text) {
  errorEl.textContent = text;
  errorEl.classList.add('show');
  setTimeout(() => errorEl.classList.remove('show'), 12000);
}

// ============================================
// 處理 /動作/ → *動作*
// ============================================
function processUserInput(rawText) {
  let text = rawText.trim();
  if (!text) return null;
  text = text.replace(/\/([^\/\n]+?)\//g, '*$1*');
  return text;
}

// ============================================
// API providers
// ============================================
const FALLBACK_MODELS = [
  'nousresearch/hermes-3-llama-3.1-405b:free',
  'qwen/qwen3-next-80b-a3b-instruct:free',
  'z-ai/glm-4.5-air:free',
  'minimax/minimax-m2.5:free',
  'openai/gpt-oss-120b:free',
  'google/gemma-3-27b-it:free',
  'meta-llama/llama-3.2-3b-instruct:free'
];

async function callPollinations(systemPrompt, userMessage) {
  const allMessages = [
    { role: 'system', content: systemPrompt },
    ...state.messages,
    { role: 'user', content: userMessage }
  ];

  const response = await fetchWithTimeout('https://text.pollinations.ai/openai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'openai', messages: allMessages, private: true })
  }, 90000);

  if (!response.ok) throw new Error('Pollinations 服務錯誤 ' + response.status);
  const data = await response.json();
  const reply = data.choices?.[0]?.message?.content;
  if (!reply) throw new Error('回應格式錯誤');
  return reply;
}

// 帶 timeout 的 fetch 包裝
async function fetchWithTimeout(url, options, timeoutMs = 60000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    return res;
  } catch (e) {
    if (e.name === 'AbortError') {
      throw new Error(`回應逾時（${Math.round(timeoutMs/1000)}秒）— 模型太忙，建議切換其他模型`);
    }
    if (e.message === 'Failed to fetch' || e.message?.includes('NetworkError')) {
      throw new Error('網路錯誤 — 檢查連線或稍後再試');
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function tryOpenRouterModel(model, allMessages) {
  const response = await fetchWithTimeout('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + config.openrouterKey,
      'HTTP-Referer': window.location.origin,
      'X-Title': 'Crushie Chat'
    },
    body: JSON.stringify({ model, messages: allMessages, max_tokens: 1500 })
  }, 90000);

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const detail = data.error?.message || data.error?.code || `HTTP ${response.status}`;
    throw new Error(detail);
  }
  if (data.error) throw new Error(data.error.message || data.error.code || JSON.stringify(data.error));

  const reply = data.choices?.[0]?.message?.content;
  if (!reply) {
    const finishReason = data.choices?.[0]?.finish_reason;
    throw new Error(finishReason ? `空回應 (finish_reason: ${finishReason})` : '空回應');
  }
  return reply;
}

async function callOpenRouter(systemPrompt, userMessage) {
  if (!config.openrouterKey) throw new Error('需要設定 OpenRouter API Key（點右上齒輪）');

  const allMessages = [
    { role: 'system', content: systemPrompt },
    ...state.messages,
    { role: 'user', content: userMessage }
  ];

  const primary = config.openrouterModel;
  const tried = [];

  try {
    return await tryOpenRouterModel(primary, allMessages);
  } catch (e) {
    tried.push(`${primary.split('/')[1]}: ${e.message}`);
  }

  if (config.autoFallback) {
    // 只試前 3 個備用模型（避免一次失敗等太久）
    let attempts = 0;
    for (const m of FALLBACK_MODELS) {
      if (m === primary) continue;
      if (attempts >= 3) break;
      attempts++;
      try {
        const reply = await tryOpenRouterModel(m, allMessages);
        showError(`${primary.split('/')[1]} 不可用，已自動切換到 ${m.split('/')[1].replace(':free','')}`);
        return reply;
      } catch (e) {
        tried.push(`${m.split('/')[1]}: ${e.message}`);
      }
    }
  }

  throw new Error('所有模型都失敗：\n' + tried.slice(0, 3).join('\n') + (config.autoFallback ? '\n\n建議：到設定改用其他模型' : '\n（可在設定開啟「自動降級」）'));
}

async function callAnthropic(systemPrompt, userMessage) {
  if (!config.anthropicKey) throw new Error('需要設定 Anthropic API Key（點右上齒輪）');

  const conversationMessages = [...state.messages, { role: 'user', content: userMessage }];

  const response = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': config.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1500,
      system: systemPrompt,
      messages: conversationMessages
    })
  }, 90000);

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || ('Anthropic 錯誤 ' + response.status));
  }

  const data = await response.json();
  return data.content[0].text;
}

async function callAI(systemPrompt, userMessage) {
  switch (config.provider) {
    case 'pollinations': return await callPollinations(systemPrompt, userMessage);
    case 'openrouter': return await callOpenRouter(systemPrompt, userMessage);
    case 'anthropic': return await callAnthropic(systemPrompt, userMessage);
    default: return await callPollinations(systemPrompt, userMessage);
  }
}

// ============================================
// 發送訊息
// ============================================
async function sendMessage(rawText) {
  if (state.isLoading) return;
  const char = currentCharacter();
  if (!char) return;

  const processed = processUserInput(rawText);
  if (!processed) return;

  state.isLoading = true;
  sendBtn.disabled = true;
  advanceBtn.disabled = true;
  newplotBtn.disabled = true;

  const userMsg = { role: 'user', content: processed };
  state.messages.push(userMsg);
  renderMessage(userMsg);
  scrollToBottom();

  inputEl.value = '';
  inputEl.style.height = 'auto';

  showTyping();

  try {
    const reply = await callAI(char.systemPrompt, processed);
    removeTyping();

    const botMsg = { role: 'assistant', content: reply };
    state.messages.push(botMsg);
    renderMessage(botMsg);
    scrollToBottom();
    saveHistoryForCharacter(char.id);

    // 更新好感度（只在 AI 成功回應後計算）
    applyAffection(char.id, processed);
  } catch (err) {
    removeTyping();
    showError(err.message);
    state.messages.pop();
    renderMessages();
    scrollToBottom();
  } finally {
    state.isLoading = false;
    sendBtn.disabled = false;
    advanceBtn.disabled = false;
    newplotBtn.disabled = false;
  }
}

// ============================================
// 對話歷史 (per-character)
// ============================================
function historyKey(charId) { return 'chat_history_' + charId; }

function saveHistoryForCharacter(charId) {
  try {
    localStorage.setItem(historyKey(charId), JSON.stringify(state.messages));
  } catch (e) {}
}

function loadHistoryForCharacter(charId) {
  try {
    const saved = localStorage.getItem(historyKey(charId));
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        state.messages = parsed;
        return;
      }
    }
  } catch (e) {}
  const char = CHARACTERS.find(c => c.id === charId);
  state.messages = char ? [...char.initialHistory] : [];
}

function resetConversation() {
  if (!state.currentCharId) return;
  if (!confirm('確定要重置這位角色的對話嗎？所有訊息會被刪除。')) return;
  localStorage.removeItem(historyKey(state.currentCharId));
  loadHistoryForCharacter(state.currentCharId);
  renderMessages();
  scrollToBottom();
}

// ============================================
// 設定 Modal
// ============================================
function updateProviderUI() {
  const p = providerSelect.value;
  openrouterConfig.style.display = p === 'openrouter' ? 'block' : 'none';
  anthropicConfig.style.display = p === 'anthropic' ? 'block' : 'none';
  if (p === 'pollinations') {
    providerNote.textContent = '完全免費，無需註冊。對成人內容有審查。';
  } else if (p === 'openrouter') {
    providerNote.textContent = '註冊 OpenRouter 可用許多免費模型，審查較少。';
  } else {
    providerNote.textContent = '使用 Anthropic 官方 Claude API，需付費，審查較嚴。';
  }
}

function openSettings() {
  providerSelect.value = config.provider;
  openrouterKeyInput.value = config.openrouterKey;
  openrouterModelSelect.value = config.openrouterModel;
  autoFallbackInput.checked = config.autoFallback;
  anthropicKeyInput.value = config.anthropicKey;
  updateProviderUI();
  settingsModal.classList.add('show');
}

function saveSettings() {
  config.provider = providerSelect.value;
  config.openrouterKey = openrouterKeyInput.value.trim();
  config.openrouterModel = openrouterModelSelect.value;
  config.autoFallback = autoFallbackInput.checked;
  config.anthropicKey = anthropicKeyInput.value.trim();

  localStorage.setItem('provider', config.provider);
  localStorage.setItem('openrouter_key', config.openrouterKey);
  localStorage.setItem('openrouter_model', config.openrouterModel);
  localStorage.setItem('auto_fallback', config.autoFallback ? '1' : '0');
  localStorage.setItem('anthropic_key', config.anthropicKey);

  updateStatus();
  settingsModal.classList.remove('show');
}

function updateStatus() {
  updateChatHeaderAffection();
}

// ============================================
// 事件
// ============================================
sendBtn.addEventListener('click', () => {
  if (inputEl.value.trim()) sendMessage(inputEl.value);
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (inputEl.value.trim()) sendMessage(inputEl.value);
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

advanceBtn.addEventListener('click', () => sendMessage('請繼續推進劇情'));
newplotBtn.addEventListener('click', () => sendMessage('請開啟新劇情'));
resetBtn.addEventListener('click', resetConversation);
backBtn.addEventListener('click', showHome);
settingsBtn.addEventListener('click', openSettings);
homeSettingsBtn.addEventListener('click', openSettings);
$('modal-cancel').addEventListener('click', () => settingsModal.classList.remove('show'));
$('modal-save').addEventListener('click', saveSettings);
providerSelect.addEventListener('change', updateProviderUI);
settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) settingsModal.classList.remove('show');
});

// ============================================
// 初始化
// ============================================
renderCharacterList();

// 由 hash 還原最後一頁（手機刷新時保持位置）
const initialHash = location.hash.replace('#', '');
if (initialHash && CHARACTERS.some(c => c.id === initialHash)) {
  openChat(initialHash);
} else {
  showHome();
}
</script>
